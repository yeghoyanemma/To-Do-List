<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Done — Mini To-Do</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f6f3ec;
    --paper-dark: #171510;
    --ink: #2b2620;
    --ink-dark: #ece7db;
    --line: #d8d2c2;
    --line-dark: #38342a;
    --coral: #c1572e;
    --muted: #948c76;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 48px 20px 60px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --paper: var(--paper-dark); --ink: var(--ink-dark); --line: var(--line-dark); --muted: #7d7666; }
  }
  :root[data-theme="dark"] { --paper: var(--paper-dark); --ink: var(--ink-dark); --line: var(--line-dark); --muted: #7d7666; }

  .sheet {
    width: 100%;
    max-width: 460px;
  }
  .masthead {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 14px;
    margin-bottom: 22px;
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 32px;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .count {
    font-size: 13px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  form {
    display: flex;
    gap: 10px;
    margin-bottom: 28px;
  }
  input[type="text"] {
    flex: 1;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink);
    padding: 12px 14px;
    border-radius: 3px;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    outline: none;
    transition: border-color .15s;
  }
  input[type="text"]:focus { border-color: var(--ink); }
  input[type="text"]::placeholder { color: var(--muted); }
  button.add {
    border: none;
    background: var(--ink);
    color: var(--paper);
    padding: 0 20px;
    border-radius: 3px;
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 15px;
    cursor: pointer;
  }
  button.add:active { transform: scale(0.97); }

  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px 2px;
    border-bottom: 1px solid var(--line);
  }
  li .box {
    flex-shrink: 0;
    width: 18px;
    height: 18px;
    margin-top: 2px;
    border: 1.5px solid var(--ink);
    border-radius: 50%;
    cursor: pointer;
    position: relative;
  }
  li.done .box { background: var(--coral); border-color: var(--coral); }
  li.done .box::after {
    content: "";
    position: absolute;
    left: 4px; top: 3px;
    width: 8px; height: 5px;
    border-left: 2px solid var(--paper);
    border-bottom: 2px solid var(--paper);
    transform: rotate(-45deg);
  }
  li .text {
    flex: 1;
    font-size: 16px;
    line-height: 1.4;
    cursor: pointer;
    word-break: break-word;
  }
  li.done .text { color: var(--muted); text-decoration: line-through; }
  li .meta {
    font-size: 11px;
    color: var(--muted);
    margin-top: 3px;
  }
  li .del {
    flex-shrink: 0;
    border: none;
    background: none;
    color: var(--muted);
    font-size: 18px;
    cursor: pointer;
    line-height: 1;
    padding: 0 2px;
  }
  li .del:hover { color: var(--coral); }

  .empty {
    padding: 40px 2px;
    text-align: center;
    color: var(--muted);
    font-family: 'Fraunces', serif;
    font-size: 17px;
  }
  footer {
    margin-top: 22px;
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--muted);
  }
  footer button {
    border: none;
    background: none;
    color: var(--muted);
    font-size: 12px;
    cursor: pointer;
    text-decoration: underline;
    padding: 0;
  }
  footer button:hover { color: var(--ink); }
</style>
</head>
<body>
<div class="sheet">
  <div class="masthead">
    <h1>To do</h1>
    <span class="count" id="count">0 open</span>
  </div>
  <form id="form">
    <input type="text" id="input" placeholder="Add a new task…" autocomplete="off">
    <button class="add" type="submit">Add</button>
  </form>
  <ul id="list"></ul>
  <div class="empty" id="empty" style="display:none;">All done. Good time for a coffee.</div>
  <footer>
    <span id="doneCount">0 done</span>
    <button id="clearDone">Clear completed</button>
  </footer>
</div>

<script>
  const STORAGE_KEY = 'mini-todo-tasks-v1';
  let tasks = [];
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    tasks = saved ? JSON.parse(saved) : [
      { id: 1, text: 'Prepare DAAD scholarship application', done: false },
      { id: 2, text: 'Update React project on GitHub', done: true },
    ];
  } catch (e) { tasks = []; }

  const list = document.getElementById('list');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const empty = document.getElementById('empty');
  const count = document.getElementById('count');
  const doneCount = document.getElementById('doneCount');

  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); } catch (e) {}
  }

  function render() {
    list.innerHTML = '';
    if (tasks.length === 0) {
      empty.style.display = 'block';
    } else {
      empty.style.display = 'none';
      tasks.forEach(t => {
        const li = document.createElement('li');
        li.className = t.done ? 'done' : '';
        li.innerHTML = `
          <div class="box" data-id="${t.id}"></div>
          <div class="text" data-id="${t.id}">${escapeHtml(t.text)}</div>
          <button class="del" data-id="${t.id}" aria-label="Delete">×</button>
        `;
        list.appendChild(li);
      });
    }
    const open = tasks.filter(t => !t.done).length;
    count.textContent = `${open} open`;
    doneCount.textContent = `${tasks.length - open} done`;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  form.addEventListener('submit', e => {
    e.preventDefault();
    const val = input.value.trim();
    if (!val) return;
    tasks.push({ id: Date.now(), text: val, done: false });
    input.value = '';
    save(); render();
  });

  list.addEventListener('click', e => {
    const id = e.target.dataset.id;
    if (!id) return;
    if (e.target.classList.contains('del')) {
      tasks = tasks.filter(t => t.id != id);
    } else {
      const t = tasks.find(t => t.id == id);
      if (t) t.done = !t.done;
    }
    save(); render();
  });

  document.getElementById('clearDone').addEventListener('click', () => {
    tasks = tasks.filter(t => !t.done);
    save(); render();
  });

  render();
</script>
</body>
</html>
